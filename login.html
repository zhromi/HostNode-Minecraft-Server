<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HostNode</title>
    <script>try{document.documentElement.setAttribute("data-bs-theme",localStorage.getItem("hostnode_theme")||"dark");}catch(e){}</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/script.js" defer></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-warning sticky-top px-3">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo2.png" alt="HostNode Logo" height="28" class="d-inline-block align-text-top">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-lg-3 align-items-lg-center">
                    <li class="nav-item"><a class="nav-link text-light" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link text-light" href="config.html">Config</a></li>
                    <li class="nav-item"><a class="nav-link text-light" href="plugins.html">Plugins</a></li>
                    <li class="nav-item"><a class="nav-link text-light" href="about.html">About Us</a></li>
                    <li class="nav-item"><ul id="authNav" class="navbar-nav flex-row gap-2 align-items-center"></ul></li>
                    <li class="nav-item"><button id="themeToggle" class="btn btn-theme btn-sm theme-toggle">Light</button></li>
                    <li class="nav-item"><button id="openPopupBtn" class="btn btn-warning btn-sm">Subscribe</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card p-4">
                    <h2 class="text-gold h3 mb-4 text-center">Login</h2>
                    <form id="loginForm" novalidate>
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Email</label>
                            <input type="text" class="form-control" id="loginEmail" placeholder="email@example.com">
                            <small id="loginEmailError" class="error-msg"></small>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label">Password</label>
                            <input type="password" class="form-control" id="loginPassword" placeholder="Your password">
                            <small id="loginPasswordError" class="error-msg"></small>
                        </div>
                        <button type="submit" class="btn btn-warning w-100">Login</button>
                        <p class="text-center mt-3 mb-0 small">No account? <a href="signup.html" class="text-gold">Sign Up</a></p>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div id="popupOverlay" class="popup-overlay">
        <div class="popup-box">
            <button id="closePopupBtn" class="popup-close" aria-label="Close">&times;</button>
            <h3 class="text-gold h5 mb-2">Subscribe to Updates</h3>
            <p class="text-body small mb-3">Get notified about new PaperMC builds and optimization guides</p>
            <form id="popupForm" novalidate>
                <input type="text" id="subEmail" class="form-control mb-3" placeholder="Enter your email...">
                <button type="submit" class="btn btn-warning w-100">Subscribe Now</button>
                <p id="popupMessage" class="small mt-2 mb-0 text-center"></p>
            </form>
        </div>
    </div>

    <footer class="bg-dark text-center py-3 border-top border-secondary mt-auto">
        <div class="container">
            <p class="text-secondary mb-0">Created by: Ramazan Zhunussov, Islam Baimagambet | Group: SE-2515</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
